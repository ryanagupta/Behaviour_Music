name: Build Sideloadable IPA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode_16.0.app || xcode-select -p
          xcodebuild -version

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project AppleMusic.xcodeproj \
            -scheme AppleMusic \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/AppleMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AppleMusic.xcarchive/Products/Applications/AppleMusic.app build/Payload/
          cd build
          zip -r -q Music.ipa Payload
          echo "IPA successfully packaged:"
          ls -lh Music.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music-IPA
          path: build/Music.ipa
          retention-days: 14
          if-no-files-found: error
